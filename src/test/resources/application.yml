spring:
  datasource:
    url: jdbc:h2:mem:eventos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS eventos
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: eventos
  flyway:
    enabled: false

trackflow:
  ms-envios:
    base-url: http://localhost:8081
  outbox:
    intervalo-ms: 3600000
