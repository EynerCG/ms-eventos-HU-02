spring:
  application:
    name: ms-eventos
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # El session pooler de Supabase admite 15 conexiones en total, compartidas
      # con ms-envios y con las herramientas del equipo. Sin este tope, una sola
      # instancia las agota y las demas fallan con EMAXCONNSESSION.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: eventos
  flyway:
    enabled: true
    schemas: eventos
    default-schema: eventos
    create-schemas: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

trackflow:
  ms-envios:
    base-url: ${MS_ENVIOS_BASE_URL:http://localhost:8081}
    timeout-conexion-ms: 3000
    timeout-lectura-ms: 5000
  outbox:
    intervalo-ms: 5000
    maximo-intentos: 8
    espera-base-segundos: 5
    tamano-lote: 50
